<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#000000">
<title>OSINT map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#fbfaf6;--card:#fffdf8;--ink:#17140f;--soft:#6a655c;--rule:#d8d3c8;--red:#d2301c;--tb:58px;
  --mono:"Courier Prime","Courier New",Courier,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--paper:#080807;--card:#12110f;--ink:#ece8de;--soft:#938e84;--rule:#2e2b26;--red:#ea4a33;color-scheme:dark;}
}
:root[data-theme="dark"]{--paper:#080807;--card:#12110f;--ink:#ece8de;--soft:#938e84;--rule:#2e2b26;--red:#ea4a33;color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{font-family:var(--mono);background:var(--paper);color:var(--ink);overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;font-size:14px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
input[type=range]{accent-color:var(--red)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
[hidden]{display:none!important}
a{color:inherit}

#app{position:relative;height:100%;display:flex;flex-direction:column}
#main{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0;background:#000;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
#map:active{cursor:grabbing}
#map.measuring{cursor:crosshair}

/* search */
#search{position:absolute;top:10px;left:10px;right:10px;max-width:520px;z-index:5}
#sbar{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--rule);box-shadow:0 2px 12px rgba(0,0,0,.35)}
#q{flex:1;min-width:0;border:0;background:transparent;padding:0 12px;height:44px;font-size:16px;outline:none}
#sbar button{flex:none;width:44px;height:44px;border:0;background:none;display:grid;place-items:center}
#sgo{border-left:1px solid var(--rule)!important}
#results{margin:4px 0 0;padding:0;list-style:none;background:var(--card);border:1px solid var(--rule);box-shadow:0 2px 12px rgba(0,0,0,.35);max-height:42vh;overflow:auto}
#results li{border-bottom:1px solid var(--rule)}
#results li:last-child{border-bottom:0}
#results button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;min-height:44px}
#results .t{font-weight:700;font-size:14px}
#results .s{font-size:12px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#results .msg{padding:12px;font-size:13px;color:var(--soft)}

#chips{position:absolute;top:64px;left:10px;right:70px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;z-index:3;pointer-events:none}
.chip{background:rgba(0,0,0,.82);color:#ece8de;border:1px solid #47433c;padding:4px 8px;font-size:12px;max-width:100%}
.chip.err{border-color:#e0381f;color:#ffb4a8}

#zoomctl{position:absolute;right:10px;top:64px;display:flex;flex-direction:column;gap:6px;z-index:4}
.mbtn{width:44px;height:44px;display:grid;place-items:center;padding:0;background:rgba(0,0,0,.82);border:1px solid #47433c;color:#ece8de}
.mbtn:active,.mbtn.on{background:#2a2723}
.mbtn.on{border-color:#ece8de}

#readout{position:absolute;left:8px;bottom:22px;color:#ece8de;font-size:11.5px;text-shadow:0 0 3px #000,0 0 3px #000;pointer-events:none;z-index:2}
#scale{position:absolute;left:8px;bottom:40px;color:#ece8de;font-size:11.5px;text-shadow:0 0 3px #000,0 0 3px #000;pointer-events:none;z-index:2}
#scalebar{height:7px;border:1px solid #ece8de;border-top:0;margin-bottom:2px}
#attrib{position:absolute;left:8px;right:8px;bottom:4px;color:#b9b4a8;font-size:10.5px;line-height:1.2;text-shadow:0 0 3px #000,0 0 3px #000;z-index:2;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* info card + measure */
#infocard{position:absolute;left:10px;right:10px;bottom:34px;max-width:480px;max-height:52%;overflow:auto;background:var(--card);color:var(--ink);border:1px solid var(--ink);box-shadow:0 2px 14px rgba(0,0,0,.5);padding:12px 44px 12px 12px;z-index:6}
#infocard h3{margin:0;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
#infocard .sub{margin:2px 0 8px;font-size:12px;color:var(--soft);overflow-wrap:anywhere}
#infocard .x{position:absolute;top:0;right:0;width:44px;height:44px;border:0;background:none;display:grid;place-items:center}
.tags{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:2px 12px;margin:0 0 10px;font-size:12.5px}
.tags dt{color:var(--soft);overflow-wrap:anywhere}
.tags dd{margin:0;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:6px}
#measure{position:absolute;left:10px;right:10px;bottom:34px;max-width:480px;background:var(--card);border:1px solid var(--ink);padding:10px 12px;z-index:6;box-shadow:0 2px 14px rgba(0,0,0,.5)}
#measure .res{font-size:15px;font-weight:700;margin:0 0 8px;overflow-wrap:anywhere}

/* toolbar */
#toolbar{flex:none;display:flex;background:var(--paper);border-top:1px solid var(--rule)}
#toolbar button{flex:1;min-width:0;height:var(--tb);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--ink)}
#toolbar button.on{background:var(--ink);color:var(--paper)}

/* panel */
#panel{position:absolute;left:0;right:0;bottom:var(--tb);max-height:74%;display:flex;flex-direction:column;background:var(--paper);border-top:2px solid var(--ink);z-index:8;box-shadow:0 -4px 18px rgba(0,0,0,.4)}
#panel .ph{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 6px 14px;border-bottom:1px solid var(--rule)}
#panel .ph h2{margin:0;font-size:17px}
#panel .pb{overflow:auto;padding:10px 14px 14px;-webkit-overflow-scrolling:touch}
.iconbtn{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;flex:none}
.lab{display:block;font-size:12px;color:var(--soft);margin:10px 0 4px}
.field{width:100%;border:1px solid var(--rule);background:var(--card);padding:10px;font-size:16px;border-radius:0;min-height:44px}
textarea.field{min-height:96px;resize:vertical}
select.field{appearance:auto}
.btn{border:1px solid var(--ink);background:none;padding:8px 14px;min-height:44px;font-size:14px;border-radius:0}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.sm{min-height:36px;padding:4px 10px;font-size:13px}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn[disabled]{opacity:.45;cursor:default}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#layers{list-style:none;margin:12px 0 0;padding:0}
.lrow{border-top:1px solid var(--rule)}
.lmain{display:flex;align-items:center;min-height:50px}
.vis{flex:none;width:44px;height:44px;display:grid;place-items:center;position:relative}
.vis input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.vis .box{width:22px;height:14px;border:1px solid var(--ink);background:transparent}
.vis input:checked+.box{background:var(--sw,var(--red))}
.vis input:focus-visible+.box{outline:2px solid var(--red);outline-offset:2px}
.lname{flex:1;min-width:0;text-align:left;background:none;border:0;padding:6px 4px;min-height:44px}
.lname .n{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lname .st{display:block;font-size:11.5px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lname .st.err{color:var(--red)}
.lopts{padding:4px 4px 12px 44px}
.lopts .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;align-items:center;font-size:12.5px}
.lopts input[type=range]{width:100%}
.lopts input[type=color]{width:100%;height:36px;padding:0;border:1px solid var(--rule);background:none}
.lopts input[type=text],.lopts input[type=number]{width:100%;font-size:16px;border:1px solid var(--rule);background:var(--card);padding:6px;min-height:36px}
.hint{font-size:12px;color:var(--soft);margin:6px 0}
.err{color:var(--red)}

/* modal */
.mback{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:0}
.modal{width:min(680px,100%);max-height:100%;height:100%;background:var(--paper);display:flex;flex-direction:column;border:1px solid var(--ink)}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:6px 6px 6px 14px;border-bottom:1px solid var(--rule);flex:none}
.mhead h2{margin:0;font-size:17px}
.mbody{overflow:auto;padding:12px 14px 20px;flex:1;-webkit-overflow-scrolling:touch}
@media (min-width:700px){.mback{padding:24px}.modal{height:auto;max-height:100%}}
.tabs{display:flex;gap:0;margin:0 0 12px;border:1px solid var(--ink);overflow:auto}
.tabs button{flex:1 1 auto;border:0;background:none;padding:8px 6px;min-height:40px;font-size:12.5px;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
details.cat{border-top:1px solid var(--rule)}
details.cat summary{min-height:44px;display:flex;align-items:center;font-weight:700;cursor:pointer}
.crow{display:flex;align-items:center;gap:8px;min-height:44px;padding:2px 0}
.crow .nm{flex:1;min-width:0;font-size:13.5px}
.crow .nm small{display:block;color:var(--soft);font-size:11.5px}
table.at{width:100%;border-collapse:collapse;font-size:12.5px}
table.at td,table.at th{border-top:1px solid var(--rule);padding:6px 4px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
table.at tr.click{cursor:pointer}
table.at tr.click:hover{background:var(--card)}
#toasts{position:fixed;left:10px;right:10px;bottom:calc(var(--tb) + 18px);z-index:90;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:var(--ink);color:var(--paper);padding:8px 12px;max-width:520px;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.4)}

@media (min-width:900px){
  #app{flex-direction:row}
  #panel{position:static;flex:none;width:390px;max-height:none;height:100%;border-top:0;border-right:1px solid var(--ink);box-shadow:none;z-index:1}
  #panel.closed{display:none}
  #toasts{left:auto;right:16px;align-items:flex-end}
  .mback{align-items:center}
}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app">
  <aside id="panel" hidden aria-label="Layers panel"></aside>
  <div id="main">
    <div id="stage">
      <canvas id="map" tabindex="0" aria-label="Interactive map. Drag to pan, pinch or scroll to zoom, tap a feature for details, press and hold to drop a pin."></canvas>
      <div id="search" role="search">
        <div id="sbar">
          <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Address, place or lat, lon" aria-label="Search address or place">
          <button id="sclear" type="button" aria-label="Clear search" hidden></button>
          <button id="sgo" type="button" aria-label="Search"></button>
        </div>
        <ul id="results" hidden></ul>
      </div>
      <div id="chips" aria-live="polite"></div>
      <div id="zoomctl">
        <button class="mbtn" id="zin" type="button" aria-label="Zoom in"></button>
        <button class="mbtn" id="zout" type="button" aria-label="Zoom out"></button>
      </div>
      <div id="scale"><div id="scalebar"></div><span id="scalelbl"></span></div>
      <div id="readout"></div>
      <div id="attrib"></div>
      <div id="infocard" hidden></div>
      <div id="measure" hidden></div>
    </div>
    <nav id="toolbar" aria-label="Tools"></nav>
  </div>
</div>
<div id="toasts" role="status" aria-live="polite"></div>
<script>
const Core=(function(){
'use strict';
const D2R=Math.PI/180,R_EARTH=6371008.8,MAXLAT=85.0511287798;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* ---------- projection (normalized web mercator, 0..1) ---------- */
const lonToX=lon=>(lon+180)/360;
const latToY=lat=>{lat=clamp(lat,-MAXLAT,MAXLAT);const s=Math.sin(lat*D2R);return .5-Math.log((1+s)/(1-s))/(4*Math.PI);};
const xToLon=x=>x*360-180;
const yToLat=y=>Math.atan(Math.sinh(Math.PI*(1-2*y)))/D2R;

/* ---------- geodesy ---------- */
function haversine(a,b){
  const dLat=(b[0]-a[0])*D2R,dLon=(b[1]-a[1])*D2R,la=a[0]*D2R,lb=b[0]*D2R;
  const h=Math.sin(dLat/2)**2+Math.cos(la)*Math.cos(lb)*Math.sin(dLon/2)**2;
  return 2*R_EARTH*Math.asin(Math.min(1,Math.sqrt(h)));
}
function pathLength(pts){let s=0;for(let i=1;i<pts.length;i++)s+=haversine(pts[i-1],pts[i]);return s;}
function ringArea(pts){
  const n=pts.length;if(n<3)return 0;let s=0;
  for(let i=0;i<n;i++){const a=pts[i],b=pts[(i+1)%n];s+=(b[1]-a[1])*D2R*(2+Math.sin(a[0]*D2R)+Math.sin(b[0]*D2R));}
  return Math.abs(s*R_EARTH*R_EARTH/2);
}
function fmtDist(m){
  const mi=m/1609.344,ft=m*3.28084;
  const a=m<1000?Math.round(m)+' m':(m/1000).toFixed(m<10000?2:1)+' km';
  const b=m<400?Math.round(ft)+' ft':mi.toFixed(2)+' mi';
  return a+' / '+b;
}
function fmtArea(m2){
  const ac=m2/4046.8564224,sqmi=m2/2589988.110336;
  const a=m2<10000?Math.round(m2)+' m²':m2<1e6?(m2/10000).toFixed(2)+' ha':(m2/1e6).toFixed(2)+' km²';
  const b=ac<640?ac.toFixed(ac<10?2:1)+' acres':sqmi.toFixed(2)+' sq mi';
  return a+' / '+b;
}
function fmtLatLon(lat,lon,d){d=d==null?5:d;return lat.toFixed(d)+', '+lon.toFixed(d);}

/* ---------- coordinate text ---------- */
function validLL(lat,lon){return isFinite(lat)&&isFinite(lon)&&Math.abs(lat)<=90&&Math.abs(lon)<=180;}
function parseCoords(s){
  s=String(s==null?'':s).trim();if(!s)return null;
  let m=/^([+-]?\d{1,3}(?:\.\d+)?)\s*([,;])?\s*([+-]?\d{1,3}(?:\.\d+)?)$/.exec(s);
  if(m&&(m[2]||(m[1].indexOf('.')>=0&&m[3].indexOf('.')>=0))){
    let lat=parseFloat(m[1]),lon=parseFloat(m[3]);
    if(Math.abs(lat)>90&&Math.abs(lon)<=90){const t=lat;lat=lon;lon=t;}
    return validLL(lat,lon)?{lat,lon}:null;
  }
  m=/^(\d{1,3}(?:\.\d+)?)\s*°?\s*([NS])[\s,;]+(\d{1,3}(?:\.\d+)?)\s*°?\s*([EW])$/i.exec(s);
  if(m){
    let lat=parseFloat(m[1])*(/s/i.test(m[2])?-1:1),lon=parseFloat(m[3])*(/w/i.test(m[4])?-1:1);
    return validLL(lat,lon)?{lat,lon}:null;
  }
  m=/^(\d{1,3})\s*[°d ]\s*(\d{1,2})\s*['′m ]\s*(\d{1,2}(?:\.\d+)?)\s*["″s]?\s*([NS])[\s,;]+(\d{1,3})\s*[°d ]\s*(\d{1,2})\s*['′m ]\s*(\d{1,2}(?:\.\d+)?)\s*["″s]?\s*([EW])$/i.exec(s);
  if(m){
    const lat=(+m[1]+m[2]/60+m[3]/3600)*(/s/i.test(m[4])?-1:1),lon=(+m[5]+m[6]/60+m[7]/3600)*(/w/i.test(m[8])?-1:1);
    return validLL(lat,lon)?{lat,lon}:null;
  }
  return null;
}

/* ---------- planar geometry (normalized coords) ---------- */
function pointInRing(x,y,a){
  let inside=false;
  for(let i=0,j=a.length-2;i<a.length;j=i,i+=2){
    const xi=a[i],yi=a[i+1],xj=a[j],yj=a[j+1];
    if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))inside=!inside;
  }
  return inside;
}
function segDist2(px,py,x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;
  let t=l2?((px-x1)*dx+(py-y1)*dy)/l2:0;t=t<0?0:t>1?1:t;
  const qx=x1+t*dx-px,qy=y1+t*dy-py;return qx*qx+qy*qy;
}

/* ---------- features ---------- */
function makeFeature(id,props,kind,rings,inner){
  const paths=[];let x0=1,y0=1,x1=0,y1=0;
  for(const r of rings){
    const a=new Float64Array(r.length*2);
    for(let i=0;i<r.length;i++){
      const x=lonToX(r[i][0]),y=latToY(r[i][1]);
      a[2*i]=x;a[2*i+1]=y;
      if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
    }
    paths.push(a);
  }
  return {id:id,props:props||{},kind:kind,paths:paths,inner:inner||null,bbox:[x0,y0,x1,y1]};
}
function makePoint(id,props,lon,lat){
  const x=lonToX(lon),y=latToY(lat);
  return {id:id,props:props||{},kind:'point',paths:[new Float64Array([x,y])],inner:null,bbox:[x,y,x,y]};
}
function pointAtBBox(id,props,pts){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const p of pts){if(p[0]<x0)x0=p[0];if(p[0]>x1)x1=p[0];if(p[1]<y0)y0=p[1];if(p[1]>y1)y1=p[1];}
  return makePoint(id,props,(x0+x1)/2,(y0+y1)/2);
}
function ptsOf(a){const o=[];for(let i=0;i<a.length;i+=2)o.push([xToLon(a[i]),yToLat(a[i+1])]);return o;}
function closeRing(r){if(!r.length)return r;const a=r[0],b=r[r.length-1];if(a[0]!==b[0]||a[1]!==b[1])r.push([a[0],a[1]]);return r;}
function featureToGeoJSON(f){
  let geometry;
  if(f.kind==='point'){geometry={type:'Point',coordinates:[xToLon(f.paths[0][0]),yToLat(f.paths[0][1])]};}
  else if(f.kind==='line'){
    const ls=f.paths.map(ptsOf);
    geometry=ls.length===1?{type:'LineString',coordinates:ls[0]}:{type:'MultiLineString',coordinates:ls};
  }else{
    const polys=[],outerArr=[];
    f.paths.forEach((p,i)=>{
      if(!(f.inner&&f.inner[i])){polys.push([closeRing(ptsOf(p))]);outerArr.push(p);}
    });
    f.paths.forEach((p,i)=>{
      if(!(f.inner&&f.inner[i]))return;
      const ring=closeRing(ptsOf(p));let k=polys.length-1;
      for(let j=0;j<outerArr.length;j++){if(pointInRing(p[0],p[1],outerArr[j])){k=j;break;}}
      if(k>=0)polys[k].push(ring);
    });
    if(!polys.length)polys.push(f.paths.map(p=>closeRing(ptsOf(p))));
    geometry=polys.length===1?{type:'Polygon',coordinates:polys[0]}:{type:'MultiPolygon',coordinates:polys};
  }
  return {type:'Feature',id:f.id,properties:f.props,geometry:geometry};
}
function toGeoJSON(features){return {type:'FeatureCollection',features:features.map(featureToGeoJSON)};}

/* ---------- Overpass: filters + queries ---------- */
function parseFilter(str){
  str=String(str==null?'':str).trim();if(!str)return null;
  let m=/^\[\s*(!)?\s*"([^"]+)"\s*(?:(!=|!~|=|~)\s*"((?:[^"\\]|\\.)*)")?\s*\]$/.exec(str);
  if(m){
    if(m[1])return {k:m[2],op:'!has'};
    if(!m[3])return {k:m[2],op:'has'};
    return {k:m[2],op:m[3],v:m[4].replace(/\\(.)/g,'$1')};
  }
  const unq=s=>s.trim().replace(/^"(.*)"$/,'$1');
  if(str[0]==='!'){const k=unq(str.slice(1));return k?{k:k,op:'!has'}:null;}
  let idx=-1,op=null;
  for(let i=0;i<str.length;i++){
    const c=str[i],n=str[i+1];
    if(c==='!'&&(n==='='||n==='~')){idx=i;op='!'+n;break;}
    if(c==='='||c==='~'){idx=i;op=c;break;}
  }
  if(idx<0){const k=unq(str);return k?{k:k,op:'has'}:null;}

/* ===================== tiles ===================== */
const TC=new Map(),TQ=[];let tLoading=0;const MAXLOAD=14;

    return base+'service=WMS&request=GetMap&version='+ver+'&layers='+encodeURIComponent(L.layers||'')+'&styles='+encodeURIComponent(L.styles||'')+

    startTile(e);

  if(TQ.length>400)TQ.splice(0,TQ.length-400).forEach(e=>{if(e.state===0&&e.frame!==frameNo)TC.delete(e.key);});
  if(TC.size>900){
    let n=TC.size-700;

  }

const tileErrBy={};
function startTile(e){

/* ===================== gestures ===================== */
const ptrs=new Map();let gest={moved:false,maxN:0,t:0,sx:0,sy:0},lpTimer=null;
function cancelLP(){if(lpTimer){clearTimeout(lpTimer);lpTimer=null;}}
function rectOf(){return canvas.getBoundingClientRect();}
canvas.addEventListener('pointerdown',function(e){
  if(e.pointerType==='mouse'&&e.button!==0)return;
  try{canvas.setPointerCapture(e.pointerId);}catch(_){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  tw=null;
  if(ptrs.size===1){
    gest={moved:false,maxN:1,t:performance.now(),sx:e.clientX,sy:e.clientY};
    cancelLP();
    lpTimer=setTimeout(function(){
      lpTimer=null;
      if(ptrs.size===1&&!gest.moved){gest.moved=true;const r=rectOf();onLongPress(gest.sx-r.left,gest.sy-r.top);}
    },560);
  }else{gest.maxN=Math.max(gest.maxN,ptrs.size);cancelLP();}
});
canvas.addEventListener('pointermove',function(e){
  const r=rectOf();
  if(e.pointerType==='mouse'&&!ptrs.size){hoverMove(e.clientX-r.left,e.clientY-r.top);return;}
  const p=ptrs.get(e.pointerId);if(!p)return;
  if(ptrs.size===1){
    const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
    if(!gest.moved&&Math.hypot(e.clientX-gest.sx,e.clientY-gest.sy)>7){gest.moved=true;cancelLP();}
    if(gest.moved){const ws=WS();V.mx-=dx/ws;V.my-=dy/ws;clampView();viewChanged();need();}
  }else if(ptrs.size===2){
    const v=Array.from(ptrs.values()),a=v[0],b=v[1];
    const od=Math.hypot(a.x-b.x,a.y-b.y),omx=(a.x+b.x)/2,omy=(a.y+b.y)/2;
    p.x=e.clientX;p.y=e.clientY;
    const nd=Math.hypot(a.x-b.x,a.y-b.y),nmx=(a.x+b.x)/2,nmy=(a.y+b.y)/2;
    gest.moved=true;
    if(od>0&&nd>0)zoomAt(V.z+Math.log2(nd/od),omx-r.left,omy-r.top);
    const ws=WS();V.mx-=(nmx-omx)/ws;V.my-=(nmy-omy)/ws;clampView();viewChanged();need();
  }
});
function endPtr(e){
  if(!ptrs.has(e.pointerId))return;
  const was=ptrs.size;ptrs.delete(e.pointerId);cancelLP();
  if(was===1&&!gest.moved&&gest.maxN===1&&e.type==='pointerup'&&performance.now()-gest.t<700){const r=rectOf();onTap(e.clientX-r.left,e.clientY-r.top);}
}
canvas.addEventListener('pointerup',endPtr);

canvas.addEventListener('wheel',function(e){
  e.preventDefault();tw=null;
  let dy=e.deltaY;if(e.deltaMode===1)dy*=33;else if(e.deltaMode===2)dy*=300;
  const r=rectOf();
  zoomAt(V.z+clamp(-dy*(e.ctrlKey?.01:.0018),-.9,.9),e.clientX-r.left,e.clientY-r.top);
  viewChanged();need();
},{passive:false});
canvas.addEventListener('dblclick',function(e){
  const r=rectOf();tw=null;zoomAt(V.z+1,e.clientX-r.left,e.clientY-r.top);viewChanged();need();
});
canvas.addEventListener('keydown',function(e){
  const ws=WS(),step=80/ws;let used=true;
  if(e.key==='ArrowLeft')V.mx-=step;else if(e.key==='ArrowRight')V.mx+=step;
  else if(e.key==='ArrowUp')V.my-=step;else if(e.key==='ArrowDown')V.my+=step;
  else if(e.key==='+'||e.key==='=')zoomAt(V.z+.5,V.w/2,V.h/2);
  else if(e.key==='-'||e.key==='_')zoomAt(V.z-.5,V.w/2,V.h/2);

});

function layerBBox(L){

/* ===================== overpass ===================== */
const ENDPOINTS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter'];
function endpointList(){return (S.settings.endpoint?[S.settings.endpoint]:[]).concat(ENDPOINTS);}
function withTimeout(promise,ms){
  return new Promise((resolve,reject)=>{
    const t=setTimeout(()=>reject(new Error('Request timed out')),ms);
    promise.then(v=>{clearTimeout(t);resolve(v);},e=>{clearTimeout(t);reject(e);});
  });
}
/* Plain fetch only: no AbortSignal and no custom headers, because some in-app browsers
   proxy fetch and cannot pass those objects across ("The object can not be cloned"). */
async function fetchWithTimeout(url,opts,ms){
  return withTimeout(opts?fetch(url,opts):fetch(url),ms);
}
async function overpass(query){
  let last=null;
  for(const url of endpointList()){
    try{
      const getUrl=url+(url.indexOf('?')>=0?'&':'?')+'data='+encodeURIComponent(query);
      const res=getUrl.length<7000?await fetchWithTimeout(getUrl,null,45000)
        :await fetchWithTimeout(url,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:'data='+encodeURIComponent(query)},45000);
      if(!res.ok){last=new Error('Server said HTTP '+res.status);continue;}
      const txt=await res.text();let json;
      try{json=JSON.parse(txt);}catch(e){last=new Error('Server sent an unreadable answer');continue;}
      if(json&&json.remark&&/error|timed out|out of memory/i.test(String(json.remark))){last=new Error(String(json.remark).slice(0,110));continue;}
      if(!json||!Array.isArray(json.elements)){last=new Error('Server sent no data');continue;}
      return json;
    }catch(e){last=e;}
  }
  const m=String(last&&last.message||last||'');
  if(/Failed to fetch|Load failed|NetworkError|cloned|blocked|not allowed/i.test(m))throw new Error('Could not reach the data servers ('+m.slice(0,60)+')');
  throw last||new Error('No data server answered');
}
function covers(L,vb){return L.covered.some(c=>c.w<=vb.w&&c.e>=vb.e&&c.s<=vb.s&&c.n>=vb.n);}
let fetchTimer=null,retryTimer=null;
function scheduleFetch(ms){clearTimeout(fetchTimer);fetchTimer=setTimeout(pump,ms==null?350:ms);}
function pump(){
  if(!S.fetchEnabled)return;
  const now=Date.now();let soonest=0;
  while(S.fetching<2){
    let next=null;const vb=viewBBox(0);
    for(let i=S.layers.length-1;i>=0;i--){
      const L=S.layers[i];
      if(L.kind!=='overpass'||!L.visible||L.loading||V.z<L.minZoom)continue;
      if(L.failUntil>now){soonest=soonest?Math.min(soonest,L.failUntil):L.failUntil;continue;}
      if(!covers(L,vb)){next=L;break;}
    }
    if(!next)break;
    startFetch(next);
  }
  clearTimeout(retryTimer);
  if(soonest)retryTimer=setTimeout(pump,Math.max(300,soonest-Date.now()+100));
  updateChips();
}
async function startFetch(L){
  L.loading=true;S.fetching++;const token=++L.token,rb=viewBBox(.3);
  setStatus(L,'loading','');
  try{
    const limit=L.limit||8000,json=await overpass(Core.buildQuery(L,rb,limit));
    if(L.token!==token||S.layers.indexOf(L)<0)return;
    const feats=Core.elementsToFeatures(json,{geom:L.geom});
    if(L.features.size+feats.length>limit*5){L.features.clear();L.covered=[];}
    for(const f of feats)L.features.set(f.id,f);
    L.covered.push(rb);if(L.covered.length>12)L.covered.shift();
    L.truncated=json.elements.length>=limit;
    L.failUntil=0;
    setStatus(L,'ok','');
  }catch(e){
    if(L.token===token&&S.layers.indexOf(L)>=0){
      const msg=String(e&&e.message||e);
      L.failUntil=Date.now()+(/429|timed|timeout/i.test(msg)?30000:12000);
      setStatus(L,'error',msg);
    }
  }finally{
    L.loading=false;S.fetching=Math.max(0,S.fetching-1);refreshStatus(L);need();pump();
  }
}
function statusInfo(L){
  if(L.kind==='xyz'||L.kind==='wms')return {t:(L.kind==='wms'?'WMS tiles':'Tiles')+(L.minZ?', from z'+L.minZ:''),err:false};
  if(L.kind==='file')return {t:fmtN(L.features.size)+' features (imported)',err:false};
  if(L.status.state==='error')return {t:'Error: '+L.status.msg+' (open this layer to retry)',err:true};
  if(L.loading)return {t:'Loading…',err:false};
  if(V.z<L.minZoom)return {t:'Zoom in to z'+L.minZoom+' to load',err:false};
  if(L.status.state==='ok'||L.features.size)return {t:fmtN(L.features.size)+' features'+(L.truncated?' (limit reached, zoom in for more)':''),err:false};
  return {t:'Waiting…',err:false};
}
function setStatus(L,state,msg){L.status={state:state,msg:msg};refreshStatus(L);updateChips();}
function refreshStatus(L){
  if(!L.ui||!L.ui.st)return;
  const s=statusInfo(L);L.ui.st.textContent=s.t;L.ui.st.className='st'+(s.err?' err':'');
}
function updateChips(){
  const box=$('chips');if(!box)return;
  box.textContent='';
  const need=S.layers.filter(L=>L.kind==='overpass'&&L.visible&&V.z<L.minZoom);
  if(need.length){
    const z=Math.max.apply(null,need.map(L=>L.minZoom));
    box.appendChild(h('div',{class:'chip',text:'Zoom in to z'+z+' to load: '+need.slice(0,3).map(L=>L.name).join(', ')+(need.length>3?' +'+(need.length-3):'')}));
  }
  const loading=S.layers.filter(L=>L.loading);
  if(loading.length)box.appendChild(h('div',{class:'chip',text:'Loading '+loading.slice(0,2).map(L=>L.name).join(', ')+(loading.length>2?' +'+(loading.length-2):'')+'…'}));
  const errs=S.layers.filter(L=>L.kind==='overpass'&&L.visible&&L.status.state==='error'&&!L.loading);
  if(errs.length)box.appendChild(h('div',{class:'chip err',text:errs.length+' layer'+(errs.length>1?'s':'')+' could not load. Open Layers to retry, or run Settings, then Test connection.'}));
}

/* ===================== persistence ===================== */
let warnedSize=false;
function serialize(){
  const ll=pxToLL(V.w/2,V.h/2);
  const layers=S.layers.map(L=>{
    const o={id:L.id,kind:L.kind,name:L.name,visible:L.visible,opacity:L.opacity,style:L.style};
    if(L.kind==='overpass'){
      o.minZoom=L.minZoom;
      if(L.catId)o.catId=L.catId;else{o.sets=L.sets;o.raw=L.raw||null;o.types=L.types;o.geom=L.geom;o.limit=L.limit;}
    }else if(L.kind==='xyz'||L.kind==='wms'){
      ['url','sub','max','minZ','blend','layers','wmsVersion','format','styles','attr','top'].forEach(k=>{if(L[k]!==undefined)o[k]=L[k];});
    }else if(L.kind==='file'){
      if(L.src&&L.src.text&&L.src.text.length<1500000)o.src=L.src;else{o.src=null;if(!warnedSize){warnedSize=true;toast('A large imported layer is too big to save in the browser and will not be restored.',5000);}}
    }
    return o;
  });
  return {v:1,view:{lat:ll.lat,lon:ll.lon,z:V.z},basemap:S.basemap,layers:layers,pins:S.pins,settings:S.settings,panelOpen:S.panelOpen};
}
const saveNow=function(){
  if(S.noSave)return;
  try{localStorage.setItem(KEY,JSON.stringify(serialize()));}
  catch(e){if(!saveNow.warned){saveNow.warned=true;toast('Could not save your layers in this browser.',4000);}}
};
const scheduleSave=debounce(saveNow,700);
function loadSaved(){
  let raw=null;
  try{raw=localStorage.getItem(KEY);}catch(e){}
  if(!raw)return null;
  try{const o=JSON.parse(raw);return o&&o.v===1?o:null;}catch(e){return null;}
}
function restore(sv){
  S.basemap=Catalog.BASEMAPS.some(b=>b.id===sv.basemap)?sv.basemap:'ground';
  S.pins=Array.isArray(sv.pins)?sv.pins.filter(p=>p&&Core.validLL(p.lat,p.lon)):[];
  S.settings=Object.assign({endpoint:''},sv.settings||{});
  S.panelOpen=sv.panelOpen;
  let skipped=0;
  for(const o of (Array.isArray(sv.layers)?sv.layers:[])){
    try{
      let L=null;
      if(o.kind==='overpass'){
        if(o.catId){L=layerFromCatalog(o.catId);if(L&&o.minZoom)L.minZoom=o.minZoom;}
        else if((o.sets&&o.sets.length)||o.raw){L=baseLayer({id:o.id,kind:'overpass',name:o.name,sets:o.sets||[],raw:o.raw||null,types:o.types||'nwr',geom:o.geom||'auto',minZoom:o.minZoom||15,limit:o.limit||8000,style:{},defStyle:clone(o.style||{})});}
      }else if(o.kind==='xyz'||o.kind==='wms'){
        if(o.url)L=baseLayer({id:o.id,kind:o.kind,name:o.name,url:o.url,sub:o.sub||'',max:o.max||19,minZ:o.minZ||0,blend:o.blend||null,layers:o.layers,wmsVersion:o.wmsVersion,format:o.format,styles:o.styles,attr:o.attr||'',top:!!o.top,style:{}});
      }else if(o.kind==='file'&&o.src&&o.src.text){
        const r=Core.parseAny(o.src.name||o.name,o.src.text);
        L=baseLayer({id:o.id,kind:'file',name:o.name,geom:'auto',src:o.src,style:{},defStyle:clone(o.style||{})});
        for(const f of r.features)L.features.set(f.id,f);
        L.status={state:'ok',msg:''};
      }
      if(!L)continue;
      L.id=o.id||L.id;L.name=o.name||L.name;L.visible=o.visible!==false;L.opacity=o.opacity==null?1:o.opacity;
      if(o.style&&Object.keys(o.style).length)L.style=o.style;
      S.layers.push(L);
    }catch(e){skipped++;try{console.warn('Skipped a saved layer',e);}catch(_){}}
  }
  if(skipped)setTimeout(()=>toast('Skipped '+skipped+' saved layer'+(skipped>1?'s':'')+' that could not be loaded.',4500),600);
}
function defaultLayers(){
  ['buildings','bike-lanes','traffic-signals','cameras'].forEach(id=>{const L=layerFromCatalog(id);if(L)insertLayer(L);});
}

/* ===================== geocoding ===================== */
let lastNom=0;
async function nominatim(q){
  const gap=1150-(Date.now()-lastNom);if(gap>0)await new Promise(r=>setTimeout(r,gap));
  lastNom=Date.now();
  const vb=V.z>=8?viewBBox(0):null;
  const url='https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=8&q='+encodeURIComponent(q)+(vb?'&viewbox='+[vb.w,vb.n,vb.e,vb.s].map(v=>v.toFixed(5)).join(','):'');
  const res=await fetchWithTimeout(url,null,15000);
  if(!res.ok)throw new Error('Search service said HTTP '+res.status);
  const arr=await res.json();
  if(!Array.isArray(arr))throw new Error('Search service sent an unreadable answer');
  return arr.map(r=>{
    const a=r.address||{},line=a.house_number&&a.road?a.house_number+' '+a.road:'';
    const lat=parseFloat(r.lat),lon=parseFloat(r.lon),bb=r.boundingbox&&r.boundingbox.length===4?r.boundingbox.map(parseFloat):null;
    return {title:line||r.name||String(r.display_name||'').split(',')[0]||'Result',sub:r.display_name||'',lat:lat,lon:lon,
      bbox:bb&&bb.every(isFinite)?{s:bb[0],n:bb[1],w:bb[2],e:bb[3]}:null,type:r.addresstype||r.type||''};
  }).filter(r=>Core.validLL(r.lat,r.lon));
}
async function photon(q){
  const ll=pxToLL(V.w/2,V.h/2);
  const url='https://photon.komoot.io/api/?limit=8&lat='+ll.lat.toFixed(4)+'&lon='+ll.lon.toFixed(4)+'&q='+encodeURIComponent(q);
  const res=await fetchWithTimeout(url,null,15000);
  if(!res.ok)throw new Error('Backup search said HTTP '+res.status);
  const j=await res.json();
  if(!j||!Array.isArray(j.features))throw new Error('Backup search sent an unreadable answer');
  return j.features.map(f=>{
    const p=f.properties||{},c=f.geometry&&f.geometry.coordinates||[];
    const street=p.housenumber&&p.street?p.housenumber+' '+p.street:(p.street||'');
    const title=p.name||street||'Result';
    const sub=[street&&street!==title?street:'',p.city||p.district||p.county,p.state,p.postcode,p.country].filter(Boolean).join(', ');
    const e=p.extent&&p.extent.length===4?{w:p.extent[0],n:p.extent[1],e:p.extent[2],s:p.extent[3]}:null;
    return {title:title,sub:sub,lat:c[1],lon:c[0],bbox:e,type:p.type||''};
  }).filter(r=>Core.validLL(r.lat,r.lon));
}
async function geocode(q){
  const c=Core.parseCoords(q);
  if(c)return {results:[{title:Core.fmtLatLon(c.lat,c.lon),sub:'Coordinates',lat:c.lat,lon:c.lon,bbox:null,type:'coords'}],via:'coords'};
  let err1=null;
  try{const r=await nominatim(q);if(r.length)return {results:r,via:'nominatim'};}catch(e){err1=e;}
  try{const r=await photon(q);return {results:r,via:'photon'};}
  catch(e2){if(err1)throw err1;throw e2;}
}
async function reverseGeocode(lat,lon){
  const gap=1150-(Date.now()-lastNom);if(gap>0)await new Promise(r=>setTimeout(r,gap));
  lastNom=Date.now();
  const res=await fetchWithTimeout('https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&lat='+lat.toFixed(6)+'&lon='+lon.toFixed(6),null,15000);
  if(!res.ok)throw new Error('Lookup service said HTTP '+res.status);
  const j=await res.json();
  if(!j||j.error)throw new Error(j&&j.error?String(j.error):'No address found here');
  return j.display_name||'No address found here';
}
function zoomForResult(r){
  const t=String(r.type||'');
  if(/house|building|address|apartments|residential|commercial|yes|coords|amenity|shop|office|retail|public|industrial/i.test(t))return 19;
  if(/road|street|highway|footway|path/i.test(t))return 17;
  return null;
}

function parseHash(){
  const m=/^#(\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/.exec(window.location.hash||'');
  if(!m)return null;const z=parseFloat(m[1]),lat=parseFloat(m[2]),lon=parseFloat(m[3]);
  return Core.validLL(lat,lon)&&z>=0&&z<=MAXZ?{z:z,lat:lat,lon:lon}:null;
}

/* ===================== identify / tap ===================== */
function hitTest(px,py){
  for(let i=S.pins.length-1;i>=0;i--){
    const p=S.pins[i],q=llToPx(p.lat,p.lon);
    if(Math.abs(q[0]-px)<=16&&py>=q[1]-36&&py<=q[1]+8)return {kind:'pin',pin:p};
  }
  const ws=WS(),tol=16/ws,cx=V.mx+(px-V.w/2)/ws,cy=V.my+(py-V.h/2)/ws;
  let bp=null,bpd=1e9,bl=null,bld=1e9,bg=null,bga=1e9;
  for(let li=S.layers.length-1;li>=0;li--){
    const L=S.layers[li];
    if(!L.visible||(L.kind!=='overpass'&&L.kind!=='file'))continue;
    const poi=L.geom==='poi';
    for(const f of L.features.values()){
      const b=f.bbox;
      if(cx<b[0]-tol||cx>b[2]+tol||cy<b[1]-tol||cy>b[3]+tol)continue;
      if(f.kind==='point'){
        const d=Math.hypot((f.paths[0][0]-cx)*ws,(f.paths[0][1]-cy)*ws);
        if(d<=15&&d<bpd){bpd=d;bp={layer:L,f:f};}
      }else if(f.kind==='line'){
        let m=1e18;
        for(const p of f.paths)for(let i=0;i+3<p.length;i+=2){const d2=Core.segDist2(cx,cy,p[i],p[i+1],p[i+2],p[i+3]);if(d2<m)m=d2;}
        const d=Math.sqrt(m)*ws;
        if(d<=10&&d<bld){bld=d;bl={layer:L,f:f};}
      }else{
        if(poi){const d=Math.hypot(((b[0]+b[2])/2-cx)*ws,((b[1]+b[3])/2-cy)*ws);if(d<=15&&d<bpd){bpd=d;bp={layer:L,f:f};}}
        let inside=false;
        for(const p of f.paths)if(Core.pointInRing(cx,cy,p))inside=!inside;
        if(inside){const a=(b[2]-b[0])*(b[3]-b[1]);if(a<bga){bga=a;bg={layer:L,f:f};}}
      }
    }
  }
  const r=bp||bl||bg;
  return r?{kind:'feat',layer:r.layer,f:r.f}:null;
}
function onTap(px,py){
  hideResults();
  if(S.tool==='measure'){addMeasurePoint(px,py);return;}
  const hit=hitTest(px,py);
  if(hit&&hit.kind==='pin'){showPinCard(hit.pin);return;}
  if(hit&&hit.kind==='feat'){S.sel={layer:hit.layer,f:hit.f};S.marker=null;showFeatureCard(hit.layer,hit.f);need();return;}
  if(!$('infocard').hidden||S.sel||S.marker)closeCard();
}
function onLongPress(px,py){

  const ll=pxToLL(px,py);

/* ===================== search ===================== */
function hideResults(){$('results').hidden=true;}
function setResults(nodes){const r=$('results');r.textContent='';nodes.forEach(n=>r.appendChild(n));r.hidden=!nodes.length;}
let searchSeq=0;
async function doSearch(){
  const q=$('q').value.trim();if(!q){hideResults();return;}
  const seq=++searchSeq;
  setResults([h('li',null,h('div',{class:'msg',text:'Searching…'}))]);
  try{
    const g=await geocode(q);
    if(seq!==searchSeq)return;
    if(g.via==='coords'||g.results.length===1){hideResults();pickResult(g.results[0]);return;}
    if(!g.results.length){setResults([h('li',null,h('div',{class:'msg',text:'No matches. Try adding the city, state or ZIP code.'}))]);return;}
    setResults(g.results.map(r=>h('li',null,h('button',{type:'button',onclick:()=>{hideResults();pickResult(r);}},h('div',{class:'t',text:r.title}),h('div',{class:'s',text:r.sub})))));
  }catch(e){
    if(seq!==searchSeq)return;
    setResults([h('li',null,h('div',{class:'msg err',text:'Search failed: '+(e&&e.message||e)+'. Check your connection and try again.'}))]);
  }
}
function pickResult(r){
  const z=zoomForResult(r);
  if(r.bbox&&z==null&&(r.bbox.n-r.bbox.s>0.0006||r.bbox.e-r.bbox.w>0.0006))fitBounds(r.bbox,.25);
  else flyTo(r.lat,r.lon,z||17);
  S.sel=null;S.marker={lat:r.lat,lon:r.lon};
  showLocationCard({lat:r.lat,lon:r.lon},r.title,r.sub||Core.fmtLatLon(r.lat,r.lon,6));
  need();
}
function buildSearch(){
  $('sgo').innerHTML=icon('search');$('sclear').innerHTML=icon('close',18);
  const q=$('q');
  q.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doSearch();}});
  q.addEventListener('input',()=>{$('sclear').hidden=!q.value;});
  $('sgo').addEventListener('click',doSearch);
  $('sclear').addEventListener('click',()=>{q.value='';$('sclear').hidden=true;hideResults();q.focus();});
}
function locate(){
  if(!navigator.geolocation){toast('This browser cannot share your location.');return;}
  toast('Finding your location…',2200);
  navigator.geolocation.getCurrentPosition(function(pos){
    const lat=pos.coords.latitude,lon=pos.coords.longitude;
    S.me={lat:lat,lon:lon,acc:pos.coords.accuracy||0};flyTo(lat,lon,Math.max(V.z,17));
  },function(err){toast(err&&err.code===1?'Location permission was denied.':'Could not get your location.',3800);},{enableHighAccuracy:true,timeout:15000,maximumAge:30000});
}

/* ===================== attribute table ===================== */
function openAttributes(L){
  const filter=h('input',{class:'field',type:'search',placeholder:'Filter by name or tag value','aria-label':'Filter features'});
  const info=h('p',{class:'hint'}),tbody=h('tbody');
  function build(){
    const term=filter.value.trim().toLowerCase(),cx=V.mx,cy=V.my,arr=[];
    for(const f of L.features.values()){
      const label=featLabel(L,f);
      if(term&&label.toLowerCase().indexOf(term)<0){
        let hit=false;for(const k in f.props){if(String(f.props[k]).toLowerCase().indexOf(term)>=0){hit=true;break;}}
        if(!hit)continue;
      }
      const c=featCenter(f);arr.push({f:f,label:label,d:(c[0]-cx)*(c[0]-cx)+(c[1]-cy)*(c[1]-cy)});
    }
    arr.sort((a,b)=>a.d-b.d);
    info.textContent=fmtN(arr.length)+' feature'+(arr.length===1?'':'s')+(arr.length>200?'. Showing the 200 nearest to the map centre.':'.');
    tbody.textContent='';
    arr.slice(0,200).forEach(r=>{
      const keys=Object.keys(r.f.props).filter(k=>k!=='name').slice(0,3).map(k=>k+'='+String(r.f.props[k]).slice(0,24)).join('  ');
      const tr=h('tr',{class:'click',tabindex:'0',onclick:()=>choose(r.f)},h('td',{text:r.label}),h('td',{text:keys}));
      tr.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();choose(r.f);}});
      tbody.appendChild(tr);
    });
  }
  function choose(f){
    closeModal();S.sel={layer:L,f:f};S.marker=null;
    const ll=featCenterLL(f);
    if(f.kind==='point')flyTo(ll.lat,ll.lon,Math.max(V.z,18));
    else fitBounds({w:Core.xToLon(f.bbox[0]),e:Core.xToLon(f.bbox[2]),n:Core.yToLat(f.bbox[1]),s:Core.yToLat(f.bbox[3])},.3);
    showFeatureCard(L,f);need();
  }
  filter.addEventListener('input',build);build();
  openModal(L.name+': table',h('div',null,filter,info,h('table',{class:'at'},h('thead',null,h('tr',null,h('th',{text:'Feature'}),h('th',{text:'Tags'}))),tbody)));
}

  const where=window.location.protocol+'//'+(window.location.host||'(local file)')+(window.top!==window?'  (embedded in another page)':'');
  out.appendChild(h('p',{class:'hint',text:'Page: '+where}));

  let failed=0;
  function line(label){
    const p=h('p',{style:{margin:'10px 0'},text:label+': testing…'});out.appendChild(p);
    return function(ok,msg){if(!ok)failed++;p.textContent=(ok?'OK  ':'FAILED  ')+label+(msg?': '+msg:'');if(!ok)p.className='err';};
  }
  const a=line('Map data (Overpass)'),b=line('Address search (Nominatim)'),c=line('Backup search (Photon)'),d=line('Map tiles (OpenStreetMap)');
  const tile=new Promise(res=>{const im=new Image();im.onload=()=>res(null);im.onerror=()=>res('could not load a tile');im.src='https://tile.openstreetmap.org/0/0/0.png?t='+Date.now();setTimeout(()=>res('timed out'),12000);});
  const jobs=[
    overpass('[out:json][timeout:10];node["amenity"="bench"](40.7178,-74.0431,40.7179,-74.0430);out;').then(()=>a(true),e=>a(false,String(e&&e.message||e))),
    nominatim('Newark, New Jersey').then(r=>b(r.length>0,r.length?r.length+' results':'no results'),e=>b(false,String(e&&e.message||e))),
    photon('Newark New Jersey').then(r=>c(r.length>0,r.length?r.length+' results':'no results'),e=>c(false,String(e&&e.message||e))),
    tile.then(m=>d(!m,m||''))
  ];
  await Promise.all(jobs);
  out.appendChild(h('p',{class:'hint',text:failed?'Some checks failed. If the page is opened inside the Claude app or another app\u2019s preview, those viewers often block network access. Open the file from your own website in Safari instead.':'Everything reachable. If a layer still shows an error, open it and tap Retry.'}));
}

/* ===================== toolbar + boot ===================== */
function buildToolbar(){
  const tb=$('toolbar');tb.textContent='';
  [['layers','Layers','tb-layers',()=>setPanel(S.panelOpen?false:true)],['plus','Add layer','tb-add',()=>openAdd()],
   ['ruler','Measure','tb-measure',()=>setTool(S.tool==='measure'?'identify':'measure')],['pin','Pins','tb-pins',openPins],['locate','Locate','tb-locate',locate]
  ].forEach(a=>tb.appendChild(h('button',{type:'button',id:a[2],html:icon(a[0],22)+'<span>'+a[1]+'</span>',onclick:a[3]})));
  $('zin').innerHTML=icon('plus');$('zout').innerHTML=icon('minus');
  $('zin').addEventListener('click',()=>{const ll=pxToLL(V.w/2,V.h/2);flyTo(ll.lat,ll.lon,Math.round(V.z)+1,240);});
  $('zout').addEventListener('click',()=>{const ll=pxToLL(V.w/2,V.h/2);flyTo(ll.lat,ll.lon,Math.round(V.z)-1,240);});
}
function layout(){
  const st=$('stage'),w=st.clientWidth,hh=st.clientHeight;
  if(!w||!hh)return;
  V.w=w;V.h=hh;V.dpr=Math.min(window.devicePixelRatio||1,3);
  canvas.width=Math.round(w*V.dpr);canvas.height=Math.round(hh*V.dpr);
  clampView();need();
}
function boot(){
  const sv=loadSaved();
  if(sv){restore(sv);}else{defaultLayers();}
  const hv=parseHash();
  if(hv){V.z=hv.z;V.mx=Core.lonToX(hv.lon);V.my=Core.latToY(hv.lat);}
  else if(sv&&sv.view&&Core.validLL(sv.view.lat,sv.view.lon)){V.z=clamp(+sv.view.z||16,1,MAXZ);V.mx=Core.lonToX(sv.view.lon);V.my=Core.latToY(sv.view.lat);}
  applyTheme();buildToolbar();buildSearch();buildPanel();
  setPanel(S.panelOpen==null?isDesktop():!!S.panelOpen);
  new ResizeObserver(layout).observe($('stage'));
  window.addEventListener('hashchange',()=>{const v=parseHash();if(v)flyTo(v.lat,v.lon,v.z,0);});
  window.addEventListener('beforeunload',saveNow);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(need);
  layout();updateChips();scheduleFetch(200);need();
  window.__app={S:S,V:V,Core:Core,Catalog:Catalog,addCatalogLayer:addCatalogLayer,removeLayer:removeLayer,flyTo:flyTo,hitTest:hitTest,need:need,pump:pump,
    renderLayers:renderLayers,openAdd:openAdd,onTap:onTap,onLongPress:onLongPress,serialize:serialize,saveNow:saveNow,statusInfo:statusInfo,fitBounds:fitBounds,
    addCustomOverpass:addCustomOverpass,importText:importText,openConnTest:openConnTest,geocode:geocode,doSearch:doSearch,pxToLL:pxToLL,llToPx:llToPx,TC:TC,
    frames:()=>frameNo,draw:draw,openAttributes:openAttributes,zoomToLayer:zoomToLayer};
}
boot();

})();

</script>
